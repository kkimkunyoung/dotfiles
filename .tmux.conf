# ==========================================
# REBIND PREFIX
# ==========================================
# Change default Ctrl+b to Ctrl+a (easier to reach)
set -g prefix C-a
unbind C-b
bind C-a send-prefix


# ==========================================
# GENERAL SETTINGS
# ==========================================
# Enable mouse mode (click to select panes, resize panes, scroll)
set -g mouse on

# Don't rename windows automatically
set-option -g allow-rename off


# ==========================================
# KEY BINDINGS
# ==========================================
# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Switch panes using Alt-arrow without prefix
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-b select-pane -L
bind -n M-f select-pane -R


# ==========================================
# THEME & DESIGN
# ==========================================
# Status bar styling
set -g status-style bg=black,fg=white
set -g status-left '#[fg=green]#S '
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M'

# Highlight the active window in the status bar
setw -g window-status-current-style bg=blue,fg=white,bold
